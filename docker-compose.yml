version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: lumen-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: lumen-frontend
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  postgres:
    image: postgres:16-alpine
    container_name: lumen-postgres
    environment:
      POSTGRES_DB: lumen_protocol
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lumen-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
