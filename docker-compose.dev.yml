version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: lumen-backend
    env_file:
      - ./backend/.env.example
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000

  frontend:
    build:
      context: ./frontend
    container_name: lumen-frontend
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000 # <-- ДОБАВИТЬ ЭТУ СТРОКУ
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    container_name: lumen-postgres
    environment:
      POSTGRES_DB: lumen_protocol
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lumen-redis

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
